  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter Tight';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"2c7e4203-a48b-4876-853b-b7a11459c00a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#F6F6F1;color:#161616;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\na{color:inherit;text-decoration:none}\na:hover{color:inherit}\nbutton{font-family:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Inter',system-ui,sans-serif;background:#F6F6F1;color:#161616;font-size:17px;line-height:1.55\">\n\n<!-- NAV -->\n<header style=\"position:sticky;top:0;z-index:20;background:rgba(246,246,241,0.94);backdrop-filter:blur(10px)\">\n  <div>\n    <div style=\"max-width:1320px;margin:0 auto;padding:0 40px;height:36px;display:flex;align-items:flex-end;justify-content:flex-end\">\n      <div style=\"display:flex;gap:8px\">\n        <sc-for list=\"{{ swatches }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ s.pick }}\" aria-label=\"{{ s.name }}\" title=\"{{ s.name }}\" style=\"width:14px;height:14px;border-radius:50%;background:{{ s.hex }};border:0;padding:0;cursor:pointer;box-shadow:{{ s.ring }};transition:box-shadow 150ms, transform 150ms\" style-hover=\"transform:scale(1.15)\"><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1320px;margin:0 auto;padding:0 40px\">\n    <div style=\"height:88px;display:flex;align-items:center;gap:clamp(20px,3vw,40px);border-bottom:1px solid #DCDCD4\">\n      <a href=\"#top\" style=\"display:flex;flex-shrink:0\"><img src=\"7609bee0-9d66-4318-b173-3df1a9db6c79\" alt=\"Superintelligent\" style=\"height:24px;width:auto;display:block\"><\u002Fa>\n      <nav style=\"flex:1 1 auto;min-width:0;overflow:hidden;display:flex;justify-content:flex-end;gap:clamp(16px,2.4vw,36px);font-size:16px;font-weight:500;white-space:nowrap\">\n        <a href=\"#programs\" style-hover=\"opacity:0.6\">Programs<\u002Fa><a href=\"#free\" style-hover=\"opacity:0.6\">Free<\u002Fa><a href=\"#subscription\" style-hover=\"opacity:0.6\">Subscription<\u002Fa><a href=\"#teams\" style-hover=\"opacity:0.6\">For teams<\u002Fa>\n      <\u002Fnav>\n      <div style=\"display:flex;gap:10px;flex-shrink:0\">\n        <a href=\"#\" style=\"border:1.5px solid #161616;border-radius:6px;padding:11px 20px;font-size:15px;font-weight:600\" style-hover=\"background:#161616;color:#F6F6F1\">Log in<\u002Fa>\n        <a href=\"#finder\" style=\"background:var(--acc,#B9A7FF);border-radius:6px;padding:12.5px 20px;font-size:15px;font-weight:600\" style-hover=\"background:color-mix(in oklab, var(--acc,#B9A7FF) 80%, #FFFFFF)\">Find my program<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" data-screen-label=\"Hero\" style=\"max-width:1320px;margin:0 auto;padding:80px 40px 112px\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:64px;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:36px\">\n      <sc-if value=\"{{ h1 }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(60px,7.4vw,112px);line-height:0.92;letter-spacing:-0.055em\">Learn AI by building <span style=\"background:linear-gradient(transparent 58%,var(--acc,#B9A7FF) 58%,var(--acc,#B9A7FF) 96%,transparent 96%);padding:0 0.04em\">with it.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ h2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(52px,6.2vw,96px);line-height:0.92;letter-spacing:-0.055em\">AI is already part of your job. <span style=\"background:linear-gradient(transparent 58%,var(--acc,#B9A7FF) 58%,var(--acc,#B9A7FF) 96%,transparent 96%);padding:0 0.04em\">Get good at it.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ h3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(72px,9vw,136px);line-height:0.88;letter-spacing:-0.06em\">Get good <span style=\"background:linear-gradient(transparent 58%,var(--acc,#B9A7FF) 58%,var(--acc,#B9A7FF) 96%,transparent 96%);padding:0 0.04em\">at AI.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n      <p style=\"margin:0;font-size:20px;line-height:1.55;max-width:560px;text-wrap:pretty\">Superintelligent is where people and teams learn AI. In every program you build something that works on your real job, from your first agent to a system your whole team shares. Start free, or go all the way. Answer three questions and we'll point you to the right program.<\u002Fp>\n      <div style=\"display:flex;gap:28px;align-items:center;flex-wrap:wrap\">\n        <a href=\"#finder\" style=\"background:var(--acc,#B9A7FF);border-radius:6px;padding:20px 32px;font-size:18px;font-weight:600\" style-hover=\"background:color-mix(in oklab, var(--acc,#B9A7FF) 80%, #FFFFFF)\">Find my program<\u002Fa>\n        <a href=\"#programs\" style=\"font-size:17px;font-weight:600;padding-bottom:4px;border-bottom:1.5px solid #161616\" style-hover=\"opacity:0.6\">See every program<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:15px;color:#66665F;padding-top:8px\">\n        <span><strong style=\"font-weight:600;color:#161616\">AI &amp; Agents Professional<\u002Fstrong> · starts Mon, Nov 2<\u002Fspan>\n        <span><strong style=\"font-weight:600;color:#161616\">AI &amp; Agents Advanced<\u002Fstrong> · starts Mon, Nov 9<\u002Fspan>\n        <span><strong style=\"font-weight:600;color:#161616\">AI Champions Bootcamp<\u002Fstrong> · starts Mon, Nov 16<\u002Fspan>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <sc-if value=\"{{ typePlates }}\" hint-placeholder-val=\"{{ true }}\">\n      <figure style=\"margin:0;aspect-ratio:4/5;max-height:640px;background:var(--acc,#B9A7FF);color:#161616;padding:clamp(28px,4vw,48px);display:flex;flex-direction:column;justify-content:space-between;gap:32px\">\n        <div style=\"display:flex;justify-content:space-between;gap:16px;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase\"><span>AI &amp; Agents Professional<\u002Fspan><span>Week 3<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:clamp(20px,3vw,36px)\">\n          <span style=\"font-size:clamp(17px,1.5vw,20px);font-weight:600;padding-bottom:16px;border-bottom:2px solid #161616\">Morning briefing · Tue<\u002Fspan>\n          <span style=\"font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(44px,5vw,76px);line-height:0.94;letter-spacing:-0.05em\">3 meetings need prep<\u002Fspan>\n          <span style=\"font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(44px,5vw,76px);line-height:0.94;letter-spacing:-0.05em;opacity:0.55\">2 decisions waiting on you<\u002Fspan>\n        <\u002Fdiv>\n        <figcaption style=\"font-size:15px;font-weight:500;padding-top:16px;border-top:1px solid rgba(22,22,22,0.35)\">A morning briefing that writes itself. Pulls your calendar, inbox and priorities into one summary before you start.<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ photoSlots }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"aspect-ratio:4/5;max-height:640px;position:relative\"><image-slot id=\"hero-photo\" shape=\"rect\" placeholder=\"Real photo: a learner's build on screen, or a live cohort session\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FINDER -->\n<section id=\"finder\" data-screen-label=\"Finder\" style=\"background:#161616;color:#F6F6F1;scroll-margin-top:124px\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:112px 40px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px 64px;flex-wrap:wrap;margin-bottom:72px\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-size:14px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase\">01 / Find your program<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(44px,5vw,76px);line-height:0.95;letter-spacing:-0.05em;max-width:760px\">Find your program in three questions<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:19px;color:#B9B9B2;max-width:400px\">Tell us who you're learning for and where you are. We'll give you one program to start with, and a free way in.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:56px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column\">\n        <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"padding:32px 0;border-bottom:1px solid #33332F;display:flex;flex-direction:column;gap:20px\">\n            <div style=\"display:flex;align-items:baseline;gap:24px\"><span style=\"font-size:15px;color:#8A8A83;width:24px\">{{ q.n }}<\u002Fspan><h3 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:28px;letter-spacing:-0.03em\">{{ q.title }}<\u002Fh3><\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;padding-left:48px\">\n              <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:12px;background:{{ o.bg }};color:{{ o.fg }};border:1.5px solid {{ o.border }};border-radius:6px;padding:15px 20px;font-size:16px;font-weight:600;cursor:pointer;transition:all 150ms\" style-hover=\"border-color:var(--acc,#B9A7FF)\">\n                  <span style=\"width:18px;height:18px;border-radius:50%;border:{{ o.ring }};flex-shrink:0;transition:all 150ms\"><\u002Fspan>{{ o.label }}\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <a href=\"#programs\" style=\"margin:28px 0 0 48px;font-size:16px;font-weight:500;align-self:flex-start;border-bottom:1px solid #F6F6F1;padding-bottom:3px\" style-hover=\"opacity:0.7\">I'd rather see every program<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:var(--acc,#B9A7FF);color:#161616;border-radius:10px;padding:clamp(28px,3.5vw,44px);display:flex;flex-direction:column;gap:24px;position:sticky;top:160px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n          <span style=\"font-size:14px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase\">Start here<\u002Fspan>\n          <button sc-camel-on-click=\"{{ reset }}\" style=\"border:0;background:none;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:#161616;padding:0\">Start over<\u002Fbutton>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(36px,3.6vw,52px);line-height:0.95;letter-spacing:-0.05em\">{{ result.name }}<\u002Fh3>\n        <p style=\"margin:0;font-size:19px;line-height:1.5\">{{ result.line }}<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 24px\">\n          <sc-for list=\"{{ result.facts }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;flex-direction:column;gap:2px;grid-column:{{ f.span }}\"><span style=\ e-slot id=\"builds-photo\" shape=\"rect\" placeholder=\"Real screenshot of a learner build, cropped tight\"><\u002Fimage-slot><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column\">\n      <span style=\"font-size:14px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:22px\">02 / What people build<\u002Fspan>\n      <h2 style=\"margin:0 0 20px;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(44px,4.6vw,68px);line-height:0.95;letter-spacing:-0.05em\">Every program ends with something that works<\u002Fh2>\n      <p style=\"margin:0 0 40px;font-size:19px;color:#55554F;max-width:520px\">You learn on your own work, in the tools you already have, and you keep what you build.<\u002Fp>\n      <sc-for list=\"{{ builds }}\" as=\"b\" hint-placeholder-count=\"6\">\n        <a href=\"#programs\" style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 16px;padding:30px 0;border-top:1px solid #DCDCD4\" style-hover=\"opacity:0.75\">\n          <span style=\"font-size:15px;color:#8A8A83;padding-top:6px\">{{ b.n }}<\u002Fspan>\n          <strong style=\"font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-0.03em\">{{ b.title }}<\u002Fstrong>\n          <span><\u002Fspan>\n          <span style=\"font-size:17px;color:#55554F;line-height:1.55\">{{ b.line }}<\u002Fspan>\n          <span><\u002Fspan>\n          <span style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;margin-top:10px\">{{ b.tag }}<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROGRAMS -->\n<section id=\"programs\" data-screen-label=\"Programs\" style=\"background:#EBEAE4;scroll-margin-top:124px\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:128px 40px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px 64px;flex-wrap:wrap;margin-bottom:72px\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <span style=\"font-size:14px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase\">03 / Programs<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:800;font-size:clamp(56px,6.4vw,96px);line-height:0.92;letter-spacing:-0.055em\">Programs<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:19px;color:#55554F;max-width:480px\">One path from the basics to running agents across a company, and a program for the people who bring AI to their teams. Pick by what you want to build, not by job title.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px 32px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid #161616\">\n      <h3 style=\"margin:0;font-family:'Inter Tight',sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.03em\">The AI &amp; Agents path<\u002Fh3>\n      <span style=\"font-size:16px;color:#55554F\">Three levels. Start at the one that fits and keep going.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:0 1px;background:#D2D1C9\">\n      <sc-for list=\"{{ path }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <article style=\"background:{{ p.bg }};padding:36px 32px 40px;display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"width:40px;height:40px;border-radius:50%;background:{{ p.dot }};color:{{ p.dotFg }};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px\">{{ p.n }}<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase\">{{ p.level }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n ;imagery&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Type plates&quot;,&quot;options&quot;:[&quot;Type plates&quot;,&quot;Photo slots&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Learn AI by building with it.&quot;,&quot;options&quot;:[&quot;Learn AI by building with it.&quot;,&quot;AI is already part of your job. Get good at it.&quot;,&quot;Get good at AI.&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nconst Q = [\n  { key: 'who', title: 'Who are you learning for?', opts: [['me', 'Just me'], ['team', 'My team'], ['company', 'My whole company']] },\n  { key: 'use', title: 'How much do you use AI today?', opts: [['none', 'Not much yet'], ['chat', 'Most days, mostly chat'], ['build', 'I build agents or automations']] },\n  { key: 'goal', title: 'What do you want to leave with?', opts: [['basics', 'The basics, done properly'], ['agents', 'Agents that do real work for me'], ['team', 'AI my whole team uses'], ['plan', 'A plan and rules for the whole company']] },\n];\nconst F = (k, v, span) => ({ k, v, span: span ? 'span 2' : 'auto' });\nconst P = {\n  F: { line: 'The basics, done properly, in your own time.', facts: [F('Length', 'Self-paced'), F('Time', 'Your own pace'), F('Price', '$199'), F('Next start', 'Any time'), F('Access', 'Lifetime', true)] },\n  P: { line: 'Four weeks to build a team of six AI agents run by a Chief of Staff, with a live dashboard and an automated morning briefing.', facts: [F('Length', '4 weeks'), F('Time', 'About 3 hours a week'), F('Price', '$749'), F('Next start', 'Mon, Nov 2'), F('Works in', 'ChatGPT, Claude, Gemini or Copilot', true)] },\n  A: { line: 'Build agents on your real systems, and the rules your company runs them by.', facts: [F('Length', '6 weeks + prep week'), F('Time', '5 to 7 hours a week'), F('Price', '$2,500 per seat'), F('Next start', 'Mon, Nov 9'), F('Works in', 'Cursor, Claude Code, Codex, GitHub Copilot or Antigravity', true)] },\n  C: { line: 'Lead AI adoption on your team.', facts: [F('Length', '3 weeks'), F('Time', '6 live sessions, 2 hours each'), F('Price', '$2,500 per seat'), F('Next start', 'Mon, Nov 16'), F('Works in', 'The tools your company already allows', true)] },\n};\nfunction route({ who, use, goal }) {\n  const MP = 'The Multiplayer AI Sprint';\n  if (who === 'me') {\n    if (use === 'none') return { ...P.F, name: 'AI & Agents Foundations', free: 'AIDB New Year in January, otherwise AI Summer Adventure', after: 'AI & Agents Professional', why: \"You're starting out. This covers the basics properly, at your own pace.\" };\n    if (use === 'chat') return { ...P.P, name: 'AI & Agents Professional', free: 'Claw Camp', after: 'AI & Agents Advanced, or the Subscription', why: 'You already use AI most days. This turns it into agents that handle real parts of your job.' };\n    return { ...P.A, name: 'AI & Agents Advanced', free: 'Agent OS', after: 'The Superintelligent Subscription', why: 'You already build. This puts agents on your real systems, with the rules to run them by.' };\n  }\n  if (who === 'team') {\n    if (goal === 'basics' || goal === 'agents') return { ...P.P, name: 'AI & Agents Professional, as a team', free: MP, after: 'AI Champions Bootcamp for whoever leads AI on the team', why: 'Your team learns together, and each person leaves with agents doing real work.' };\n    return { ...P.C, name: 'AI Champions Bootcamp', free: MP, after: 'AI & Agents Professional for the team', why: 'You want the whole team using AI. One champion builds the fix and gets colleagues using it.' };\n  }\n  if (goal === 'plan') return { ...P.A, name: 'AI & Agents Advanced, for the team that sets the rules', free: MP, after: 'Professional across the company, a champion on every team', why: 'Someone has to build the agents and write the rules. This is for that team.' };\n  const f = use === 'none';\n  return { ...(f ? P.F : P.P), name: f ? 'Foundations, as a company cohort' : 'Professional, as a company cohort', free: MP, after: 'Talk to us', why: 'Your company starts on one date and learns together, on its own work.' };\n}\nconst BUILDS = [\n  ['A morning briefing that writes itself', 'Pulls your calendar, inbox and priorities into one summary before you start.', 'AI & Agents Professional, week 3'],\n  ['An agent team with a Chief of Staff', 'Six specialists for research, strategy, data, your craft, communication and operations, coordinated by one agent.', 'AI & Agents Professional, week 4'],\n  ['A ranked map of where AI should go', 'Every candidate use case scored on value, feasibility, investment and risk, then sorted into build now, build after governance, learning pilot, scope and plan, or parked.', 'AI & Agents Advanced, weeks 1 and 2'],\n  ['An operations agent on live systems', 'Connected to real mail, chat and calendar, then tested against a golden set with human checkpoints before it runs.', 'AI & Agents Advanced, weeks 3 and 4'],\n  ['One agent a whole team shares', 'Built on a shared folder of plain files any agent can read, with an honest verdict at the end on whether it works.', 'The Multiplayer AI Sprint, week 4'],\n  ['A team fix, shipped with an eval plan', 'One real team problem, solved with the tools the company already allows, tested, rolled out and supported.', 'AI Champions Bootcamp'],\n];\nconst PATH = [\n  { n: '1', level: 'Level one', name: 'AI & Agents Foundations', formerly: 'New', line: 'The basics, done properly, in your own time.', desc: 'Self-paced, with short videos and 10 to 12 hands-on projects. Start the day you sign up and keep access for life.', who: \"People starting out with AI, or who've only used it now and then.\", length: 'Self-paced', time: 'Your own pace', price: '$199', next: 'Any time', tools: 'Lifetime access', cta1: 'See Foundations', cta2: 'Start now', bg: '#F6F6F1', dot: '#EBEAE4', dotFg: '#161616' },\n  { n: '2', level: 'Level two', name: 'AI & Agents Professional', formerly: 'Formerly Executive Catch-Up', line: 'Build a team of AI agents that does real work for you.', desc: 'Four weeks, hands-on. You build six specialists, a Chief of Staff that runs them, a live dashboard and an automated morning briefing. You keep the method to build more.', who: 'Anyone who uses AI and wants it to take real work off their plate. No code or technical background.', length: '4 weeks', time: 'About 3 hours a week', price: '$749 per person', next: 'Mon, Nov 2', tools: 'ChatGPT, Claude, Gemini or Microsoft Copilot', cta1: 'See Professional', cta2: 'Register', bg: '#F6F6F1', dot: 'var(--acc,#B9A7FF)', dotFg: '#161616' },\n  { n: '3', level: 'Level three', name: 'AI & Agents Advanced', formerly: 'Formerly Executive Agent Leadership', line: 'Build agents on your real systems, and the rules your company runs them by.', desc: 'Six weeks for people who will do the building. A first agent, then an operations agent wired into live mail, chat and calendar, then a small fleet. You leave with six frameworks your company can run on.', who: 'AI leads, transformation leads, heads of innovation, executives and individual contributors who build.', length: '6 weeks + prep week', time: '5 to 7 hours a week', price: '$2,500 per seat', next: 'Mon, Nov 9', tools: 'Cursor, Claude Code, Codex, GitHub Copilot or Antigravity', cta1: 'See Advanced', cta2: 'Register', bg: '#F6F6F1', dot: '#161616', dotFg: 'var(--acc,#B9A7FF)' },\n];\nconst FREE = [\n  { mono: 'Ny', name: 'AIDB New Year', format: '10 weeks · badges as you go', line: 'Ten weeks, ten AI skills, starting in January.', who: 'People who want a structured start with AI. Join on your own or as a team.', cta: 'Get notified for 2027', status: '2027 dates soon', tileBg: '#EBEAE4', href: 'https://aidbnewyear.com' },\n  { mono: 'Sa', name: 'AI Summer Adventure', format: 'Self-paced · any level', line: '24 hands-on projects across three levels, from getting more out of tools you already have to running agentic workflows.', who: 'Any level. Pick your tier.', cta: 'Start AI Summer Adventure', status: 'Open', tileBg: '#FFFFFF', href: 'https://summeradventure.ai' },\n  { mono: 'Cc', name: 'Claw Camp', format: 'Self-paced · 12 steps', line: 'Twelve steps from your first agent to a coordinated agent team.', who: 'Anyone ready to go past a single prompt and build an actual agent.', cta: 'Start Claw Camp', status: 'Open', tileBg: 'var(--acc,#B9A7FF)', href: 'https://campclaw.ai' },\n  { mono: 'Os', name: 'Agent OS', format: 'Self-paced · twelve projects', line: 'Build your own agentic operating system.', who: \"People who've built an agent and want a full personal setup in Claude Code, Codex or another agentic tool.\", cta: 'Start Agent OS', status: 'Open', tileBg: '#EBEAE4', href: 'https://aidbagentos.ai' },\n  { mono: 'Mp', name: 'The Multiplayer AI Sprint', format: '4 weeks · teams of about four', line: 'Four weeks for a team to find, design and ship one agent everyone shares.', who: 'Teams of about four. Works with at least one or two colleagues.', cta: 'Start the Sprint', status: 'Open', tileBg: '#FFFFFF', href: 'https://multiplayerai.ai' },\n  { mono: 'Fl', name: 'Frontier Lab webinars', format: 'Live · every registrant gets the recording', line: 'One technique per live session. Every registrant gets the recording.', whoLabel: 'Recent', who: 'Build Your Personal AI Benchmark (Oct 1, 2026) · Agentic Loops for Knowledge Workers (Aug 26, 2026)', cta: 'See upcoming sessions', status: 'Next session soon', tileBg: '#161616', href: '#' },\n];\nconst ROUTES = [\n  { goal: 'Use AI well every day', color: '#E5484D', tint: '#F8E1DF', stops: [['AIDB New Year or AI Summer Adventure', 0], ['AI & Agents Foundations', 1], ['AI & Agents Professional', 1]] },\n  { goal: 'Build agents that work for me', color: '#2F6FDE', tint: '#E0E8F5', stops: [['Claw Camp or Agent OS', 0], ['AI & Agents Professional', 1], ['AI & Agents Advanced', 1]] },\n  { goal: 'Get my team using AI', color: '#F08C2E', tint: '#F8E9DA', stops: [['The Multiplayer AI Sprint', 0], ['AI Champions Bootcamp', 1], ['Professional for the whole team', 1]] },\n  { goal: 'Lead AI across the company', color: '#2AA05A', tint: '#DFEEE3', stops: [['The Multiplayer AI Sprint', 0], ['AI & Agents Advanced', 1], ['Company cohorts, a champion on every team', 1]] },\n  { goal: 'Keep up every month', color: '#8A55D6', tint: '#EAE3F4', stops: [['Frontier Lab webinars', 0], ['Subscription, Operator', 1], ['Subscription, Leader', 1]] },\n];\nconst FAQS = [\n  ['Do I need to be technical?', 'Not for Foundations, Professional or most free programs. You need one paid AI tool, about $20 a month, or a company license. Advanced and the Champions Bootcamp need an agentic building tool you can use at work, like Claude Code, Codex or Cursor.'],\n  ['Which AI tools do the programs use?', \"The one you already have. Professional works in ChatGPT, Claude, Gemini or Microsoft Copilot. Advanced works in Cursor, Claude Code, Codex, GitHub Copilot or Antigravity. We don't sell you a tool.\"],\n  [\"What's free?\", 'AIDB New Year, AI Summer Adventure, Claw Camp, Agent OS, The Multiplayer AI Sprint and the Frontier Lab webinars. No trial that turns into a charge.'],\n  ['Where do I start?', \"Take the three-question finder. If you'd rather choose yourself, the path goes Foundations, then Professional, then Advanced, and you can start at any level.\"],\n  ['How much time does it take?', 'Professional is about 3 hours a week for four weeks. Advanced is 5 to 7 hours a week for six weeks. The Champions Bootcamp is six 2-hour live sessions over three weeks, plus homework. Foundations and the free programs go at your pace.'],\n  [\"Is my company's data safe?\", \"You work in your company's approved tool under your own account, so your company's data policy applies. No program requires uploading sensitive documents.\"],\n  ['Can my company pay by invoice or purchase order?', 'Yes. Request a quote, then pay by invoice, card or ACH. Orders over $12,000 go by ACH, wire or invoice.'],\n  [\"What if it's not for me?\", 'Full refund through the end of week one. No form, no approval.'],\n  ['What happened to Executive Catch-Up and Executive Agent Leadership?', \"They're now AI & Agents Professional and AI & Agents Advanced. Same programs, new names.\"],\n  ['How is Superintelligent connected to The AI Daily Brief?', \"Superintelligent is the AI education company of Nathaniel Whittemore, who hosts The AI Daily Brief. The show is free media. The free programs are made together. Paid programs and the subscription are Superintelligent's.\"],\n  ['What happened to readiness audits?', 'Agent Readiness audits are no longer offered to new customers. Existing clients can log in to find their sessions, interviews and reports.'],\n];\nconst DEFAULTS = { who: 'me', use: 'chat', goal: 'agents' };\nconst SWATCHES = [\n  { name: 'Lilac', hex: '#B9A7FF' }, { name: 'Sky', hex: '#7CC2FF' }, { name: 'Mint', hex: '#7EE0B5' },\n  { name: 'Pink', hex: '#FF8FA3' }, { name: 'Yellow', hex: '#FFDB33' },\n];\n\nclass Component extends DCLogic {\n  state = { answers: { ...DEFAULTS }, faqOpen: 0, hoverRoute: null, freeIdx: 2 };\n  componentDidMount() {\n    let saved = null;\n    try { saved = localStorage.getItem('super-accent'); } catch (e) {}\n    if (saved && SWATCHES.some(s => s.hex === saved)) this.setState({ acc: saved });\n    this.applyAccent();\n  }\n  componentDidUpdate() { this.applyAccent(); }\n  accent() { return this.state.acc ?? this.props.accent ?? '#B9A7FF'; }\n  applyAccent() { document.documentElement.style.setProperty('--acc', this.accent()); }\n  pickAccent(hex) {\n    try { localStorage.setItem('super-accent', hex); } catch (e) {}\n    this.setState({ acc: hex });\n  }\n  renderVals() {\n    const { answers, faqOpen, hoverRoute } = this.state;\n    const headline = this.props.headline ?? 'Learn AI by building with it.';\n    return {\n      swatches: SWATCHES.map(s => ({ ...s, ring: s.hex === this.accent() ? '0 0 0 2px #F6F6F1, 0 0 0 3.5px #161616' : 'none', pick: () => this.pickAccent(s.hex) })),\n      typePlates: (this.props.imagery ?? 'Type plates') === 'Type plates',\n      photoSlots: (this.props.imagery ?? 'Type plates') === 'Photo slots',\n      h1: headline.startsWith('Learn'), h2: headline.startsWith('AI is'), h3: headline.startsWith('Get good'),\n      questions: Q.map((q, i) => ({\n        n: `0${i + 1}`, title: q.title,\n        opts: q.opts.map(([v, label]) => {\n          const on = answers[q.key] === v;\n          return { label, bg: on ? 'var(--acc,#B9A7FF)' : 'transparent', fg: on ? '#161616' : '#F6F6F1', border: on ? 'var(--acc,#B9A7FF)' : '#44443F', ring: on ? '5px solid #161616' : '1.5px solid #8A8A83', pick: () => this.setState(s => ({ answers: { ...s.answers, [q.key]: v } })) };\n        }),\n      })),\n      reset: () => this.setState({ answers: { ...DEFAULTS } }),\n      result: route(answers),\n      builds: BUILDS.map(([title, line, tag], i) => ({ n: `0${i + 1}`, title, line, tag })),\n      path: PATH,\n      free: FREE.map((f, i) => ({ ...f, color: i === this.state.freeIdx ? '#161616' : '#85857E', dot: i === this.state.freeIdx ? 'var(--acc,#B9A7FF)' : 'transparent', pick: () => this.setState({ freeIdx: i }) })),\n      freeActive: { whoLabel: \"Who it's for\", ...FREE[this.state.freeIdx] },\n      routes: ROUTES.map((r, i) => ({\n        goal: r.goal, color: r.color, tint: r.tint,\n        opacity: hoverRoute != null && hoverRoute !== i ? 0.3 : 1,\n        stops: r.stops.map(([label, paid], j) => ({ label, fill: paid ? '#161616' : '#FFFFFF', href: j === 0 ? '#free' : '#programs' })),\n        enter: () => this.setState({ hoverRoute: i }), leave: () => this.setState({ hoverRoute: null }),\n      })),\n      faqs: FAQS.map(([q, a], i) => ({ q, a, open: faqOpen === i, rot: faqOpen === i ? 'rotate(45deg)' : 'none', toggle: () => this.setState(s => ({ faqOpen: s.faqOpen === i ? null : i })) })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
